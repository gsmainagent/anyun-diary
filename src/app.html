<!doctype html>
<html lang="zh-CN">
  <head>
        <script>(function(){try{var t=localStorage.getItem('anyun-theme');if(t!=='dark'&&t!=='light'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<meta charset="utf-8" />

    <title>安允日记 · 歌单时间线</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
